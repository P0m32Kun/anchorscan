# 打 tag (v*) 时自动交叉编译多平台归档并发布到 GitHub Release。
# 归档包含可执行文件、DOCX sidecar 与正式模板；外部扫描器仍由用户安装。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  lab:
    uses: ./.github/workflows/lab.yml

  build:
    needs: lab
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release version injection
        run: make release-check VERSION="${GITHUB_REF_NAME}" BUILD_FLAGS=-trimpath LDFLAGS="-s -w"

      - name: Build release archive
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: make package VERSION="${GITHUB_REF_NAME}" BUILD_FLAGS=-trimpath LDFLAGS="-s -w"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anchorscan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/anchorscan-*.tar.gz
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout smoke test source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Download release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: anchorscan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist

      - name: Smoke test native release archive
        env:
          ANCHORSCAN_PACKAGE_ARCHIVE: dist/anchorscan-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          ANCHORSCAN_PACKAGE_NAME: anchorscan-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          ANCHORSCAN_PACKAGE_VERSION: ${{ github.ref_name }}
        run: go test -tags packageintegration ./scripts

  release:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true

      - name: Detect prerelease
        id: pre
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -(rc|beta|alpha|pre)[0-9]*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate checksums
        run: (cd dist && sha256sum anchorscan-*.tar.gz > checksums.txt)

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist/anchorscan-*.tar.gz
            dist/checksums.txt
          prerelease: ${{ steps.pre.outputs.is_prerelease }}
          generate_release_notes: true
